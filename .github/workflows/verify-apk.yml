name: Verify APK

# Diagnose release APKs: manifest/signature/alignment checks, then install + launch
# on Android 16 (API 36) emulators with 4 KB and 16 KB page sizes.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-apk.yml', 'tools/*.sh']
  workflow_dispatch:
    inputs:
      tags:
        description: 'Release tags to test'
        default: 'build-12 build-15'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    outputs:
      found: ${{ steps.dl.outputs.found }}
    steps:
      - uses: actions/checkout@v4
      - name: Download release APKs
        id: dl
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # qeytil copy: tolerate release tags that do not exist here (skip them instead of failing).
          TAGS="${{ inputs.tags || 'build-12 build-15' }}"
          FOUND=true
          for t in $TAGS; do
            mkdir -p apks/$t
            if ! gh release download $t -R ${{ github.repository }} -p app-release.apk -D apks/$t; then
              echo "::warning::release $t (or its app-release.apk) not found - skipping"
              rm -rf apks/$t; FOUND=false
            fi
          done
          echo "found=$FOUND" >> $GITHUB_OUTPUT
          gh api repos/${{ github.repository }}/releases --jq '.[] | .tag_name + " " + (.assets[] | .name + " size=" + (.size|tostring) + " " + (.digest // ""))' || true
          ls apks/*/app-release.apk >/dev/null 2>&1 && sha256sum apks/*/app-release.apk || echo "no release APKs downloaded"
      - name: Inspect
        run: |
          shopt -s nullglob
          for a in apks/*/app-release.apk; do bash tools/verify_apk.sh $a; done

  emulator:
    needs: inspect
    # Only when every requested release exists (qeytil copy may not have them).
    if: ${{ needs.inspect.outputs.found == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        image: ['google_apis', 'google_apis_ps16k']
    steps:
      - uses: actions/checkout@v4
      - name: Download release APKs (straight from the releases, no artifacts)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAGS="${{ inputs.tags || 'build-12 build-15' }}"
          for t in $TAGS; do mkdir -p apks/$t; gh release download $t -R ${{ github.repository }} -p app-release.apk -D apks/$t; done
      - name: Free disk space for the emulator
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /usr/local/lib/node_modules /opt/hostedtoolcache/CodeQL /usr/share/swift || true
          df -h $HOME
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Android 16 emulator - install + launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: ${{ matrix.image }}
          arch: x86_64
          ram-size: 4096M
          disk-size: 4096M
          cores: 4
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          disable-animations: true
          script: |
            bash tools/emu_install.sh apks/build-12/app-release.apk apks/build-15/app-release.apk || echo "SOME INSTALL/LAUNCH FAILED"
            bash tools/emu_conflicts.sh apks/build-12/app-release.apk apks/build-15/app-release.apk
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: shots-${{ matrix.image }}
          path: /tmp/shot_*.png
