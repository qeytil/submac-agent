name: oc-survey

on:
  push:
    paths:
      - 'tools/oc_survey_run.txt'

permissions:
  contents: write

jobs:
  survey:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          {
            echo "### grep cloud/billing symbols (lib)";
            grep -rnE 'submacRef|Cloud\.|OcLane|cloudCall|RateLimiter|Billing\.|UsageSummary|BillingNotice|showBillingNotice|openGetMore|BillingSettingsEntry|WalletChip|submac_gateway|usage_accounting|CallMinutes|CloudUsage|x-submac' lib | head -1200;
            echo "### imports of billing / cloud / lanes (lib)";
            grep -rnE "billing/|services/cloud.dart|submac_gateway|usage_accounting|oc_lanes" lib | head -300;
            echo "### android_native submac/lane/proxy";
            grep -rnE 'submac|Lane|lane|LocalProxy|proxy' android_native | head -400;
          } > tools/oc_survey_result.txt
      - run: |
          git config user.name submac-agent
          git config user.email agent@submac.site
          git add -A
          git commit -m "chore(ci): survey cloud/billing touchpoints"
          git push
