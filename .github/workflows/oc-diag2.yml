name: oc-diag2

on:
  push:
    paths:
      - 'tools/oc_diag2_run.txt'

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - name: Generate platform folders
        run: |
          flutter create --org com.submac --project-name agent --platforms android,ios .
          rm -f test/widget_test.dart
      - run: python3 tools/patch_android.py
      - run: flutter pub get
      - name: Tests
        run: |
          set +e
          flutter test > /tmp/t.log 2>&1
          echo "exit=$?" > diag_result.txt
          echo "=== FAILURES ===" >> diag_result.txt
          grep -nE "\[E\]|Expected:|Actual:|Which:|EXCEPTION|Some tests failed|Test failed|TimeoutException" /tmp/t.log | head -80 >> diag_result.txt
          echo "=== TAIL ===" >> diag_result.txt
          tail -50 /tmp/t.log >> diag_result.txt
      - name: Commit result
        run: |
          git config user.name "submac-agent"
          git config user.email "agent@submac.site"
          git add diag_result.txt
          git commit -m "chore(ci): diag result" || true
          git push