name: oc steer
on:
  push:
    paths:
      - 'tools/oc_steer_run.txt'
permissions:
  contents: write
jobs:
  apply:
    if: github.ref_name != 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Apply steer & queue fix
        run: python3 tools/oc_steer.py
      - name: Commit
        run: |
          git config user.name telesia-agent
          git config user.email agent@telesia.site
          git add -A
          git commit -m "Steer & queue: deliver mid-turn messages to opencode, uncap chain, queued cue" || true
          git push || true