name: oc-inline

on:
  push:
    paths:
      - 'tools/oc_inline_run.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/oc_inline_patch.py
      - run: |
          git config user.name "submac-agent"
          git config user.email "agent@submac.site"
          git add -A
          git commit -m "fix(chat): opencode's loop renders inline like desktop; stop the status line blinking"
          git push