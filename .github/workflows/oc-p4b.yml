name: oc-p4b
on:
  push:
    paths:
      - 'tools/oc_p4b_run.txt'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/oc_p4b_patch.py
      - run: |
          git config user.name "submac-agent"
          git config user.email "agent@submac.site"
          git add -A
          git commit -m "test(byok): bot model picker has no SubMac row"
          git push
