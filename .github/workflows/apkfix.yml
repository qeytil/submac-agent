name: apkfix
on:
  push:
    paths:
      - '.apkfix/**'
jobs:
  fix:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Patch apk workflow
        run: |
          python3 - <<'PY'
          p = '.github/workflows/apk.yml'
          s = open(p).read()
          old = """cp "$(find x-proot -type f -name 'libproot-loader.so' | head -1)" "$J/libproot-loader.so"\n"""
          new = """# Termux calls the loader usr/libexec/proot/loader (not lib*), so it must be renamed to ride in jniLibs.
          LOADER=$(find x-proot -type f \\( -name 'libproot-loader.so' -o -name 'loader' \\) | head -1)
          test -n "$LOADER" || echo "::warning::proot loader not found in the Termux package"
          cp "$LOADER" "$J/libproot-loader.so"\n"""
          assert old in s or 'LOADER=$(find x-proot' in s, 'proot loader line not found'
          if 'LOADER=$(find x-proot' not in s:
              s = s.replace(old, new, 1)
          open(p, 'w').write(s)
          print('patched')
          PY
      - run: rm -rf .apkfix
      - name: Commit
        run: |
          git config user.name telesia-bot
          git config user.email bot@telesia.app
          git add -A
          git commit -m "ci: bundle the Termux proot loader (it is named loader, not libproot-loader.so) [skip ci]"
          git push