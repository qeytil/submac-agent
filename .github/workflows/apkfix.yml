name: apkfix
on:
  push:
    paths:
      - '.apkfix/**'
jobs:
  fix:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Patch apk workflow
        run: |
          python3 - <<'PY'
          p = '.github/workflows/apk.yml'
          s = open(p).read()
          name = 'libproot-loader.so'
          if 'LOADER=$(find x-proot' not in s:
              old = 'cp "$(find x-proot -type f -name \'' + name + '\' | head -1)" "$J/' + name + '"'
              new = 'LOADER=$(find x-proot -type f \\( -name \'' + name + '\' -o -name \'loader\' \\) | head -1); cp "$LOADER" "$J/' + name + '"'
              assert old in s, 'proot loader line not found'
              s = s.replace(old, new, 1)
          open(p, 'w').write(s)
          print('patched')
          PY
      - run: rm -rf .apkfix
      - name: Commit
        run: |
          git config user.name telesia-bot
          git config user.email bot@telesia.app
          git add -A
          git commit -m "ci: bundle the Termux proot loader (it is named loader, not libproot-loader.so) [skip ci]"
          git push