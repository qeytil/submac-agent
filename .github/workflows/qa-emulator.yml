name: QA on emulator

on:
  push:
    branches: [qa-emulator]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Free disk
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /usr/local/lib/node_modules /opt/hostedtoolcache/CodeQL /usr/share/swift || true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - name: Generate platform folders
        run: |
          flutter create --org com.submac --project-name agent --platforms android,ios .
          rm -f test/widget_test.dart
      - name: Make it SubMac
        run: python3 tools/patch_android.py
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - name: Build the normal app (debug) for the monkey pass
        run: |
          flutter build apk --debug
          cp build/app/outputs/flutter-apk/app-debug.apk /tmp/app-debug-main.apk
      - name: QA account for this run
        run: |
          echo "QA_EMAIL=qa.emu.$(date +%s)@example.com" >> $GITHUB_ENV
          echo "QA_PW=QaPass!$(date +%s)x" >> $GITHUB_ENV
      - name: Pre-build the QA run (same defines as the drive, so it is reused)
        run: flutter build apk --debug -t integration_test/qa_test.dart --dart-define=QA_EMAIL="$QA_EMAIL" --dart-define=QA_PW="$QA_PW"
      - name: Free memory for the emulator (2-core / 7 GB runner)
        run: |
          (cd android && ./gradlew --stop) || true
          pkill -f GradleDaemon || true
          pkill -f kotlin-daemon || true
          free -m
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          ram-size: 3072M
          disk-size: 6144M
          cores: 2
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          disable-animations: true
          script: bash tools/qa_capture.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-shots
          path: out/shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-logs
          path: out/logs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-recordings
          path: out/rec
