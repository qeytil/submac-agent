name: Chat bug hunt 4 BOTS on emulator

# Investigation only (2026-10-25): round 4, bots part. Runs only on the chat-bughunt-4-bots branch. Never on main, dev or a release.
on:
  push:
    branches: [chat-bughunt-4-bots]
    paths: ['integration_test/chat_bughunt4_bots_test.dart', 'tools/chatbug4b_capture.sh', '.github/workflows/chat-bughunt4-bots-emu.yml']

permissions:
  contents: read

concurrency:
  group: chat-bughunt4-bots-emu
  cancel-in-progress: true

jobs:
  emu:
    if: github.ref == 'refs/heads/chat-bughunt-4-bots'
    runs-on: ubuntu-latest
    timeout-minutes: 165
    steps:
      - uses: actions/checkout@v4
      - name: Free disk
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /usr/local/lib/node_modules /opt/hostedtoolcache/CodeQL /usr/share/swift || true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - name: Generate platform folders
        run: |
          flutter create --org com.submac --project-name agent --platforms android,ios .
          rm -f test/widget_test.dart
      - name: Make it SubMac
        run: python3 tools/patch_android.py
      - run: flutter pub get
      - name: Test account from repo secrets (DEMO_EMAIL / DEMO_PW)
        env:
          DEMO_EMAIL: ${{ secrets.DEMO_EMAIL }}
          DEMO_PW: ${{ secrets.DEMO_PW }}
        run: |
          if [ -z "$DEMO_EMAIL" ] || [ -z "$DEMO_PW" ]; then echo "::error::Add the DEMO_EMAIL and DEMO_PW repository secrets"; exit 1; fi
          echo "::add-mask::$DEMO_PW"
          echo "QA_EMAIL=$DEMO_EMAIL" >> $GITHUB_ENV
          echo "QA_PW=$DEMO_PW" >> $GITHUB_ENV
      - name: Pre-build the drive (same defines, so flutter drive reuses it)
        run: flutter build apk --debug -t integration_test/chat_bughunt4_bots_test.dart --dart-define=QA_EMAIL="$QA_EMAIL" --dart-define=QA_PW="$QA_PW"
      - name: Free memory for the emulator
        run: |
          (cd android && ./gradlew --stop) || true
          pkill -f GradleDaemon || true
          pkill -f kotlin-daemon || true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          ram-size: 3072M
          disk-size: 6144M
          cores: 2
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          disable-animations: true
          script: bash tools/chatbug4b_capture.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chatbug4b-shots
          path: out/shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chatbug4b-logs
          path: out/logs
