name: Inspect APK bytes

# Manual deep structural comparison of release APKs (zip structure, names, methods, manifest).
on:
  workflow_dispatch:
    inputs:
      tags:
        description: 'Release tags to inspect'
        default: 'build-12 build-15 build-19'
      emu:
        description: 'Also run the emulator job (build-19 clean + over build-12)'
        default: 'true'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Download release APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for t in ${{ inputs.tags }}; do mkdir -p apks/$t; gh release download $t -R ${{ github.repository }} -p app-release.apk -D apks/$t; done
          ls -l apks/*/app-release.apk; sha256sum apks/*/app-release.apk
      - name: Tools
        run: |
          pip install -q androguard==3.4.0a1 || pip install -q androguard
          javac -d /tmp tools/ZipCheck.java
      - name: Byte-level zip audit
        run: for a in apks/*/app-release.apk; do echo "######## $a"; python3 tools/zip_audit.py $a || true; done
      - name: Java ZipFile (Android-like) + python testzip
        run: |
          for a in apks/*/app-release.apk; do echo "######## $a"; java -cp /tmp ZipCheck $a || true
            python3 -c "import zipfile,sys; z=zipfile.ZipFile(sys.argv[1]); print('testzip:', z.testzip()); print('names', len(z.namelist()), 'unique', len(set(z.namelist())))" $a; done
      - name: androguard
        run: |
          for a in apks/*/app-release.apk; do echo "######## $a"; python3 - "$a" <<'PY' || true
          import sys
          try:
              from androguard.core.apk import APK
          except ImportError:
              from androguard.core.bytecodes.apk import APK
          x = APK(sys.argv[1])
          print("valid", x.is_valid_APK(), x.get_package(), x.get_androidversion_code(), x.get_androidversion_name(), "min", x.get_min_sdk_version(), "target", x.get_target_sdk_version())
          print("main", x.get_main_activity()); print("perms", x.get_permissions())
          PY
          done
      - name: Certificates + full manifests
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          for a in apks/*/app-release.apk; do t=$(basename $(dirname $a)); echo "######## CERT $t"
            "$BT/apksigner" verify -v --print-certs $a 2>&1 | grep -E "Verified using|certificate SHA-256|certificate DN|Number of signers"
            "$BT/aapt2" dump xmltree --file AndroidManifest.xml $a | sed -E 's/ \(Raw: "[^"]*"\)//; s#http://schemas.android.com/apk/res/android:##; s/ \(line=[0-9]+\)//' > /tmp/mann_$t.txt
            "$BT/aapt2" dump resources $a > /tmp/res_$t.txt 2>/tmp/reserr_$t.txt; echo "aapt2 dump resources rc=$? lines=$(wc -l < /tmp/res_$t.txt) err=$(head -c 300 /tmp/reserr_$t.txt)"
          done
          for t in build-15 build-19; do [ -f /tmp/mann_$t.txt ] && { echo "######## FULLMANDIFF build-12 -> $t"; diff /tmp/mann_build-12.txt /tmp/mann_$t.txt || true; }; done
          echo "######## FULLMAN build-12"; cat /tmp/mann_build-12.txt
      - name: Listings + diff
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          for a in apks/*/app-release.apk; do t=$(basename $(dirname $a))
            unzip -Z -v $a > /tmp/zinfo_$t.txt 2>&1 || true
            unzip -lv $a | awk 'NR>3{print $2, $8}' | sort -k2 > /tmp/list_$t.txt
            "$BT/aapt2" dump xmltree --file AndroidManifest.xml $a > /tmp/man_$t.txt 2>&1
            echo "######## $t: $(wc -l < /tmp/list_$t.txt) entries"; head -30 /tmp/zinfo_$t.txt
            grep -E "^(  )?(file system or operating system|minimum software version|compression method|general purpose bit flag|extended local header|file security status|The central-directory extra field)" /tmp/zinfo_$t.txt | sort | uniq -c | sort -rn | head -40
          done
          set -- $(ls apks)
          for t in "$@"; do [ "$t" = "$1" ] && continue; echo "######## entries diff $1 -> $t (method name)"; diff /tmp/list_$1.txt /tmp/list_$t.txt | head -80; echo "######## manifest diff $1 -> $t"; diff /tmp/man_$1.txt /tmp/man_$t.txt | head -150; done
          echo "######## full manifest of last"; cat /tmp/man_${@: -1}.txt
          mkdir -p out; cp /tmp/zinfo_* /tmp/list_* /tmp/man_* out/
      - uses: actions/upload-artifact@v4
        with: { name: inspect, path: out }

  emulator:
    needs: inspect
    if: ${{ inputs.emu == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Download APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: for t in build-12 build-19; do mkdir -p apks/$t; gh release download $t -R ${{ github.repository }} -p app-release.apk -D apks/$t; done
      - name: Free disk
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /usr/local/lib/node_modules /opt/hostedtoolcache/CodeQL /usr/share/swift || true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          disk-size: 4096M
          cores: 4
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          disable-animations: true
          script: |
            echo "EMU build: $(adb shell getprop ro.build.fingerprint)"
            bash tools/emu_install.sh apks/build-19/app-release.apk || echo "EMU clean install/launch FAILED"
            bash tools/emu_conflicts.sh apks/build-12/app-release.apk apks/build-19/app-release.apk 2>&1 | sed 's/^/EMU /'
