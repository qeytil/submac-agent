name: oc-p1
on:
  push:
    paths:
      - 'tools/oc_p1_run.txt'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/oc_p1_patch.py
      - run: |
          git config user.name "submac-agent"
          git config user.email "agent@submac.site"
          git add -A
          git commit -m "feat(byok): opencode gets no SubMac providers or models"
          git push
