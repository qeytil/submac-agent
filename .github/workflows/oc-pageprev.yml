name: oc pageprev
on:
  push:
    paths:
      - tools/oc_pageprev_run.txt
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: investigation/phase-1
      - run: python3 tools/oc_pageprev.py
      - run: |
          git config user.name telesia-agent
          git config user.email agent@telesia.site
          git add -A
          git commit -m "Chat: page cards show a still thumbnail, not a live web view" || echo "no change"
          git push
