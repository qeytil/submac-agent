name: oc-diag

on:
  push:
    paths:
      - 'tools/oc_diag_run.txt'

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - run: |
          T="${{ secrets.GITHUB_TOKEN }}"
          echo "len=${#T}"
          code=$(curl -s -o /tmp/j.json -w "%{http_code}" -H "Authorization: Bearer $T" "https://api.github.com/repos/qeytil/submac-agent/contents/test?ref=main")
          echo "http=$code"
          echo "--- head ---"
          head -c 300 /tmp/j.json
          echo
          echo "--- names ---"
          grep -oE '"name": *"[^"]*"' /tmp/j.json | sed -E 's/.*"([^"]*)"$/\1/' | tr '\n' ' '
          echo