name: oc-diag

on:
  push:
    paths:
      - 'tools/oc_diag_run.txt'

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo "=== test files ==="
          ls test
          echo "=== refs: showSteps ==="
          grep -rln "showSteps" test || true
          echo "=== refs: answerShowing / WorkingLine / folds ==="
          grep -rln "answerShowing" test || true
          grep -rln "WorkingLine" test || true
          grep -rln "ActivityGroup" test || true
          echo "=== refs: OpenCodeTurn / OcPart / apply( ==="
          grep -rln "OpenCodeTurn" test || true
          grep -rln "streaming" test || true
          echo "=== refs: ThinkingBlock / ToolCallCard ==="
          grep -rln "ThinkingBlock" test || true
          grep -rln "ToolCallCard" test || true