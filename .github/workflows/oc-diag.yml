name: oc-diag

on:
  push:
    paths:
      - 'tools/oc_diag_run.txt'

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - run: |
          T="${{ secrets.GITHUB_TOKEN }}"
          curl -s -H "Authorization: Bearer $T" \
            "https://api.github.com/repos/qeytil/submac-agent/contents/test?ref=main" \
            | grep -o '"name":"[^"]*"' | sed 's/"name":"//;s/"//' | tr '\n' ' '
          echo