name: oc-diag

on:
  push:
    paths:
      - 'tools/oc_diag_run.txt'

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - run: |
          git clone --depth 1 --quiet "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/qeytil/submac-agent.git" r
          cd r
          echo "=== showSteps ==="
          grep -rn "showSteps" test lib/state/settings_store.dart || true
          echo "=== answerShowing / WorkingLine / ActivityFold ==="
          grep -rn "answerShowing\|WorkingLine\|ActivityFold" test || true
          echo "=== ThinkingBlock / ToolCallCard ==="
          grep -rn "ThinkingBlock\|ToolCallCard" test || true
          echo "=== quiet / folded / narration ==="
          grep -rn "quiet\|folded\|plainNarration" test || true