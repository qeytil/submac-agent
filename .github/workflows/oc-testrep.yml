name: oc-testrep

on:
  push:
    paths:
      - 'tools/oc_testrep_run.txt'

permissions:
  contents: write

jobs:
  rep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - run: |
          flutter create --org com.submac --project-name agent --platforms android,ios .
          rm -f test/widget_test.dart
          python3 tools/patch_android.py
          flutter pub get
      - run: |
          (flutter test 2>&1 || true) > /tmp/t.txt
          grep -n -E "\[E\]|FAILED|══╡|Test failed|Expected:|Actual:|Which:|The following|Some tests failed|tests passed|package:agent/" /tmp/t.txt | tail -n 140 > tools/oc_test_tail.txt
          echo "----- last 12 lines -----" >> tools/oc_test_tail.txt
          tail -n 12 /tmp/t.txt >> tools/oc_test_tail.txt
      - run: |
          git config user.name submac-agent
          git config user.email agent@submac.site
          git add -A
          git commit -m "chore(ci): test failure details"
          git push
