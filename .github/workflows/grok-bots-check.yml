name: Grok bots check (no APK)

# Dev 2 (RESTYLE.md): analyze, unit tests and screenshots of the Bots screen for feature/grok-bots only. Never builds an APK.
on:
  push:
    branches: [feature/grok-bots, feature/bot-avatars, bughunt/agent-loop, bughunt/round2, fix/owner-feedback-1]
    paths-ignore: ['tools/**', 'docs/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: grok-bots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - name: Generate platform folders
        run: |
          flutter create --org com.submac --project-name agent --platforms android .
          rm -f test/widget_test.dart
      - run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Unit tests
        run: |
          set -o pipefail
          flutter test --reporter expanded 2>&1 | tee test-log.txt
      - name: Screenshots
        if: always()
        run: flutter test --update-goldens test/grok_bots_test.dart test/avatars_test.dart test/bughunt_loop_test.dart
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grok-bots-screens
          path: |
            test/goldens/grok_bots_*.png
            test/goldens/avatars_*.png
            test-log.txt
          retention-days: 3
