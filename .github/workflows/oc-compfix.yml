name: oc-compfix

on:
  push:
    paths:
      - 'tools/oc_compfix_run.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/oc_compfix_patch.py
      - run: |
          git config user.name "submac-agent"
          git config user.email "agent@submac.site"
          git add -A
          git commit -m "fix(bots): the owner's permission/model pills stay out of a bot's chat"
          git push