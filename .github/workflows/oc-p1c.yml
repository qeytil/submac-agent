name: oc-p1c
on:
  push:
    paths:
      - 'tools/oc_p1c_run.txt'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/oc_p1c_patch.py
      - run: |
          git config user.name "submac-agent"
          git config user.email "agent@submac.site"
          git add -A
          git commit -m "feat(byok): OcLane never falls back to a SubMac model"
          git push
