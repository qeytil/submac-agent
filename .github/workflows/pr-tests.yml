name: PR tests (analyze + unit)

# Pull requests into dev: flutter analyze + unit tests. No APK, no artifacts (the artifact quota is full).
on:
  pull_request:
    branches: [dev]
    paths-ignore: ['tools/**', 'docs/**']

permissions:
  contents: read

concurrency:
  group: pr-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - name: Generate platform folders
        run: |
          flutter create --org com.submac --project-name agent --platforms android .
          rm -f test/widget_test.dart
      - run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Unit tests
        run: flutter test
