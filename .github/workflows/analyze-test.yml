name: Check (analyze + tests, no build)

# Owner request: run flutter analyze and flutter test in CI without building an APK.
# Mirrors dev-check.yml's environment (pinned Flutter, generated platform folders)
# but stops after the tests.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true

      # android/ and ios/ are gitignored; the tracked native code lives in
      # android_native/ and is stamped in by tools/patch_android.py (same as dev-check).
      - name: Generate platform folders
        run: |
          flutter create --org com.telesia --project-name agent --platforms android,ios .
          rm -f test/widget_test.dart

      - name: Make it Telesia (manifest, native code, resources, gradle)
        run: python3 tools/patch_android.py

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Tests
        run: flutter test