name: oc-p3b
on:
  push:
    paths:
      - 'tools/oc_p3b_run.txt'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/oc_p3b_patch.py
      - run: |
          git config user.name "submac-agent"
          git config user.email "agent@submac.site"
          git add -A
          git commit -m "feat(byok): remove the wallet chip, cloud usage sheet and billing notice card"
          git push
