name: oc-rename
on:
  push:
    paths:
      - 'tools/oc_rename_run.txt'
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -e
          git rm -f tools/oc_rename_survey.txt tools/oc_rename_survey_run.txt .github/workflows/oc-rename-survey.yml 2>/dev/null || true
          # 1) text: every tracked text file with a SubMac token
          git grep -l -i 'submac' -- . ':!tools/oc_rename_run.txt' | while IFS= read -r f; do
            [ -f "$f" ] || continue
            sed -i 's/SubMac/Telesia/g; s/SUBMAC/TELESIA/g; s/Submac/Telesia/g; s/submac/telesia/g' "$f"
          done
          # 2) package id + short app name
          git grep -l 'com\.telesia\.agent' -- . | while IFS= read -r f; do sed -i 's/com\.telesia\.agent/com.telesia.app/g' "$f"; done
          git grep -l 'Telesia Agent' -- . | while IFS= read -r f; do sed -i 's/Telesia Agent/Telesia/g' "$f"; done
          # 3) file names
          git ls-files | grep -i submac | while IFS= read -r f; do
            n=$(printf '%s' "$f" | sed 's/SubMac/Telesia/g; s/SUBMAC/TELESIA/g; s/Submac/Telesia/g; s/submac/telesia/g')
            mkdir -p "$(dirname "$n")"
            git mv "$f" "$n"
          done
          git add -A
      - run: |
          git config user.name "telesia-agent"
          git config user.email "agent@telesia.site"
          git commit -m "refactor(brand): rename SubMac to Telesia; package com.telesia.app"
          git push
