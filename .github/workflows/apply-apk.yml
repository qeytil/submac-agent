name: Apply chat UI patch

on:
  push:
    paths:
      - .github/workflows/apply-apk.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: apk/chat-ui-142
          fetch-depth: 1
      - name: Apply patch
        run: |
          curl -fsSL "https://raw.githubusercontent.com/qeytil/submac-agent/apk/chat-ui-142/.ci/apk.patch.gz" -o /tmp/p.gz
          gunzip -c /tmp/p.gz > /tmp/p.patch
          test -s /tmp/p.patch
          patch -p1 -i /tmp/p.patch
          git rm -q .ci/apk.patch.gz .github/workflows/apply-apk.yml
          git config user.name "Telesia"
          git config user.email "telesia@users.noreply.github.com"
          git add -A
          git commit -q -m "Chat UI overlay + version 1.13.142+212 for the release APK"
          git push origin HEAD:apk/chat-ui-142
