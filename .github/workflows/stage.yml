name: stage
on:
  push:
    paths:
      - '.stage/**'
jobs:
  stage:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build apk.fixed.yml
        run: |
          python3 - <<'PY'
          src = '.github/workflows/apk.yml'
          out = []
          changed = False
          for line in open(src).read().split('\n'):
              if 'cp "$(find x-proot' in line and 'libproot-loader.so' in line:
                  ind = line[:len(line) - len(line.lstrip())]
                  line = (ind + 'LOADER=$(find x-proot -type f \\( -name \'libproot-loader.so\' -o -name \'loader\' \\) '
                          '| head -1); cp "$LOADER" "$J/libproot-loader.so"')
                  changed = True
              out.append(line)
          assert changed, 'loader line not found'
          open('apk.fixed.yml', 'w').write('\n'.join(out))
          print('wrote apk.fixed.yml')
          PY
          wc -c apk.fixed.yml
      - run: rm -rf .stage
      - name: Commit
        run: |
          git config user.name telesia-bot
          git config user.email bot@telesia.app
          git add -A
          git commit -m "ci: stage apk.fixed.yml [skip ci]"
          git push
