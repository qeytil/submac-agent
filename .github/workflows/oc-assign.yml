name: oc assign
on:
  push:
    paths:
      - 'tools/oc_assign_run.txt'
permissions:
  contents: write
jobs:
  apply:
    if: github.ref_name != 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Apply assign_bot wiring
        run: python3 tools/oc_assign.py
      - name: Commit
        run: |
          git config user.name telesia-agent
          git config user.email agent@telesia.site
          git add -A
          git commit -m "opencode can assign a task to a bot (assign_bot) + report result in chat" || true
          git push || true