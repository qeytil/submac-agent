name: oc-fix1
on:
  push:
    paths:
      - 'tools/oc_fix1_run.txt'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patches
        run: |
          set +e
          python3 tools/oc_fix1.py > /tmp/p.log 2>&1
          code=$?
          cat /tmp/p.log
          {
            echo "exit=$code"
            cat /tmp/p.log
          } > tools/oc_fix1_log.txt
          exit 0
      - name: Commit
        run: |
          git config user.name telesia-agent
          git config user.email agent@telesia.site
          git add -A
          git commit -m "chore(ci): brand fix attempt" || true
          git push