name: oc-fix1
on:
  push:
    paths:
      - 'tools/oc_fix1_run.txt'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patches
        run: |
          set +e
          python3 tools/oc_fix1.py > tools/oc_fix1_log.txt 2>&1
          echo "python exit=$?" >> tools/oc_fix1_log.txt
          cat tools/oc_fix1_log.txt
          # workflow files may not be pushed by the Actions token: keep their
          # fixed copies for the contents API instead
          for f in apk analyze-test oc-testrep; do
            if [ -f "tools/$f.yml.new" ]; then mv "tools/$f.yml.new" "tools/new_$f.yml"; fi
          done
          git checkout -- .github/workflows 2>/dev/null || true
          exit 0
      - name: Commit
        run: |
          set +e
          git config user.name telesia-agent
          git config user.email agent@telesia.site
          git add -A
          o=$(git commit -m "fix(brand): prefix length, applicationId com.telesia.app" 2>&1); c=$?
          echo "commit rc=$c $o"
          o=$(git push 2>&1); c=$?
          echo "push rc=$c $o"
          if [ "$c" -ne 0 ]; then
            esc=$(printf '%s' "$o" | tr '\n' '~')
            echo "::error::PUSH: $esc"
          fi
          exit 0