name: oc-dump

on:
  push:
    paths:
      - 'tools/oc_dump_run.txt'

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          {
            for f in lib/services/updater.dart lib/services/update_logic.dart lib/services/usage_accounting.dart lib/services/oc_lanes.dart lib/services/submac_gateway.dart lib/screens/settings_screen.dart lib/widgets/update_window.dart; do
              echo; echo "===== FILE: $f ====="; cat "$f";
            done
          } > tools/oc_dump_result.txt
      - run: |
          git config user.name submac-agent
          git config user.email agent@submac.site
          git add -A
          git commit -m "chore(ci): dump updater and cloud plumbing"
          git push
