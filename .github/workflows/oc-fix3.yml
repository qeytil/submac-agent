name: oc-fix3

on:
  push:
    paths:
      - 'tools/oc_fix3_run.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/oc_fix3_patch.py
      - run: |
          git config user.name "submac-agent"
          git config user.email "agent@submac.site"
          git add -A
          git commit -m "fix(bots): true message/call caps and a clear 'continues' stop"
          git push