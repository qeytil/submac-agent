name: oc minds
on:
  push:
    paths:
      - 'tools/oc_minds_run.txt'
permissions:
  contents: write
jobs:
  apply:
    if: github.ref_name != 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Apply bot-minds wiring
        run: python3 tools/oc_minds.py
      - name: Commit
        run: |
          git config user.name telesia-agent
          git config user.email agent@telesia.site
          git add -A
          git commit -m "Bots as digital humans: per-bot mind (mood/energy/memory) + self-line" || true
          git push || true