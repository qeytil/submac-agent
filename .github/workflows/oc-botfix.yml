name: oc-botfix

on:
  push:
    paths:
      - 'tools/oc_botfix_run.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/oc_botfix_patch.py
      - run: |
          git config user.name "submac-agent"
          git config user.email "agent@submac.site"
          git add -A
          git commit -m "fix(bots): a bot's tool list keeps the connected-app tools (apps_list_tools/apps_run_tool)"
          git push