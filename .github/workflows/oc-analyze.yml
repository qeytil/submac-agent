name: oc analyze
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  analyze:
    if: github.ref_name != 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - run: flutter create --org com.telesia --project-name agent --platforms android,ios .
      - run: rm -f test/widget_test.dart
      - run: python3 tools/patch_android.py
      - run: flutter pub get
      - name: Analyze to file
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings > analyze-out.txt 2>&1 || true
          head -100 analyze-out.txt
      - name: Commit output
        run: |
          git config user.name telesia-agent
          git config user.email agent@telesia.site
          git add -f analyze-out.txt
          git commit -m "ci: analyze output" || true
          git push || true
