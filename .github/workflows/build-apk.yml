name: Build APK

on:
  push:
    branches: [main]
    paths-ignore: ['.github/workflows/verify-apk.yml', '.github/workflows/inspect-apk.yml', 'tools/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true

      - name: Pinned signing key (never regenerate - a new key breaks updates)
        run: |
          test -f keys/debug.keystore || { echo "::error::keys/debug.keystore missing - refusing to sign with a new key"; exit 1; }
          keytool -list -v -keystore keys/debug.keystore -storepass android | grep -E "SHA256" | tee /tmp/k.txt
          grep -qi "4D:6D:11:6E" /tmp/k.txt || { echo "::error::keystore is not the pinned SubMac key"; exit 1; }

      - name: Generate platform folders
        run: |
          flutter create --org com.submac --project-name agent --platforms android,ios .
          rm -f test/widget_test.dart

      - name: Make it SubMac (manifest, native code, resources, gradle)
        run: |
          python3 tools/patch_android.py
          cat android/app/src/main/AndroidManifest.xml
          tail -40 android/app/build.gradle.kts

      - run: flutter pub get

      - run: dart run flutter_launcher_icons

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build APK
        timeout-minutes: 40
        run: |
          # Memory and load once a minute, so a slow or stuck build says why in its log.
          (while true; do sleep 60; echo "[watch] mem $(free -m | awk '/Mem/{print $3"/"$2" MB"}') swap $(free -m | awk '/Swap/{print $3" MB"}') load $(cut -d' ' -f1 /proc/loadavg)"; done) &
          flutter build apk --release

      - name: Verify APK (manifest, signature, 16 KB alignment)
        run: STRICT=1 bash tools/verify_apk.sh build/app/outputs/flutter-apk/app-release.apk

      - name: Read version
        id: ver
        run: |
          V=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          echo "version=$V" >> $GITHUB_OUTPUT
          C=$(grep '^version:' pubspec.yaml | sed -n 's/.*+//p')
          echo "code=$C" >> $GITHUB_OUTPUT
          echo "versionName=$V versionCode=$C"

      # qeytil copy only: the APK never goes through actions/upload-artifact (the account's
      # artifact storage quota is full). The release is published from this same job and the
      # APK and its checksum are attached directly as release assets.
      - name: Checksum
        run: |
          cd build/app/outputs/flutter-apk
          sha256sum app-release.apk | tee app-release.apk.sha256
          ls -l app-release.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: SubMac Agent ${{ steps.ver.outputs.version }} (build ${{ github.run_number }})
          body: |
            SubMac Agent ${{ steps.ver.outputs.version }}. Automated build from ${{ github.sha }}

            **If SubMac Agent 1.3.0 or 1.4.0 is on your phone, uninstall it first.** Those builds were signed with a different key, and Android refuses to update an app across keys (many phones show this as "App not installed as package appears to be invalid"). From 1.4.1 on every build uses the same key, so later updates install over this one.
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-release.apk.sha256
          # Builds from any branch but main (betas from dev) are pre-releases and never 'Latest'.
          prerelease: ${{ github.ref_name != 'main' }}
          make_latest: ${{ github.ref_name == 'main' && 'true' || 'false' }}
