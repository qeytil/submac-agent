name: oc pubfix
on:
  push:
    paths:
      - tools/oc_pubfix_run.txt
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: investigation/phase-1
      - run: python3 tools/oc_pubfix.py
      - run: |
          git config user.name telesia-agent
          git config user.email agent@telesia.site
          git add -A
          git commit -m "pubspec: schemantic ^1.1.0 -> ^1.0.0 (1.1.0 is not published)" || echo "no change"
          git push
