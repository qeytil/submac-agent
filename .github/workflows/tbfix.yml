name: tb-fix
on:
  push:
    paths:
      - '.tbfix/**'
jobs:
  fix:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Patch settings screen
        run: |
          python3 - <<'PY'
          p = 'lib/screens/settings_screen.dart'
          s = open(p).read()
          if "import 'toolbox_screen.dart';" not in s:
              s = s.replace("import 'system_screens.dart';", "import 'system_screens.dart';\nimport 'toolbox_screen.dart';", 1)
          anchor = "      _Group([\n        ListTile(\n          title: const Text('API & tool servers'),"
          tile = ("      _Group([\n"
                  "        ListTile(\n"
                  "          title: const Text('Linux toolbox'),\n"
                  "          subtitle: const Text('Install git, gh, node and other command-line tools on this phone.'),\n"
                  "          trailing: Icon(Icons.chevron_right_rounded, color: muted),\n"
                  "          onTap: () => _push(context, const ToolboxScreen()),\n"
                  "        ),\n"
                  "      ]),\n")
          if "'Linux toolbox'" not in s:
              assert anchor in s, 'anchor not found'
              s = s.replace(anchor, tile + anchor, 1)
          open(p, 'w').write(s)
          print('patched')
          PY
      - run: rm -rf .tbfix
      - name: Commit
        run: |
          git config user.name telesia-bot
          git config user.email bot@telesia.app
          git add -A
          git commit -m "settings: Linux toolbox row under Advanced [skip ci]"
          git push