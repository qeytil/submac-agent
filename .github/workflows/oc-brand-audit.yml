name: oc-brand-audit
on:
  push:
    paths:
      - 'tools/oc_audit_run.txt'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Survey
        run: |
          set -e
          {
            echo "### marker"
            cat tools/oc_audit_run.txt 2>/dev/null || true
            echo "### total occurrences (case-insensitive, submac)"
            grep -rio -i submac --exclude-dir=.git --exclude=tools/oc_audit.txt . 2>/dev/null | wc -l
            echo "### per-file counts"
            grep -ric -i submac --exclude-dir=.git 2>/dev/null | grep -v ':0$' | grep -v 'tools/oc_audit.txt' | sort -t: -k2 -nr | head -80
            echo "### file names containing submac"
            git ls-files | grep -i submac || echo "(none)"
            echo "### file names containing telesia"
            git ls-files | grep -i telesia || echo "(none)"
            echo "### android identity"
            grep -rn -i -E "applicationId|namespace|org com|com\.submac|com\.telesia|package com\." \
              --include='*.gradle' --include='*.gradle.kts' --include='*.kt' --include='*.py' \
              --include='*.yaml' --include='*.yml' --include='*.plist' --include='*.xml' \
              .github tools android_native pubspec.yaml 2>/dev/null | head -100
            echo "### failing tests: context lines"
            for f in test/bots_team_isolation_test.dart test/visual_output_test.dart test/mcp_known_test.dart test/bots_leak_test.dart test/intro_auth_flow_test.dart; do
              echo "--- $f"
              grep -n -C3 -i -E "submac|telesia|_apps_list_tools|bots_list|bot_followup|generate_image|mainConv|botConv|chat-1|\b6\b" "$f" 2>/dev/null | head -60
            done
            echo "### lib: tool naming and prefix forgiveness"
            grep -rn -E "startsWith\('|submac_|telesia_|apps_list_tools|generate_image" lib --include='*.dart' 2>/dev/null | head -120
          } > tools/oc_audit.txt
      - name: Commit
        run: |
          git config user.name telesia-agent
          git config user.email agent@telesia.site
          git add tools/oc_audit.txt
          git commit -m "chore(ci): brand audit report" || true
          git push