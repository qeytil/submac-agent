name: Marketing reel (emulator capture)

on:
  push:
    branches: [reel]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Free disk
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /usr/local/lib/node_modules /opt/hostedtoolcache/CodeQL /usr/share/swift || true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - name: Generate platform folders
        run: |
          flutter create --org com.submac --project-name agent --platforms android,ios .
          rm -f test/widget_test.dart
      - name: Make it SubMac
        run: python3 tools/patch_android.py
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - name: Pre-build (debug, so the emulator run starts quickly)
        run: flutter build apk --debug -t integration_test/reel_test.dart
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          DEMO_EMAIL: ${{ secrets.DEMO_EMAIL }}
          DEMO_PW: ${{ secrets.DEMO_PW }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          ram-size: 4096M
          disk-size: 6144M
          cores: 4
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          disable-animations: false
          script: bash tools/reel_capture.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reel-shots
          path: out/shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reel-recordings
          path: out/rec
