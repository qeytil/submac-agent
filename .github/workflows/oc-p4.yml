name: oc-p4
on:
  push:
    paths:
      - 'tools/oc_p4_run.txt'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/oc_p4_patch.py
      - run: |
          git config user.name "submac-agent"
          git config user.email "agent@submac.site"
          git add -A
          git commit -m "feat(byok): remove the SubMac entry and labels from the model picker"
          git push
