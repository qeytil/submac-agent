name: oc clean
on:
  push:
    paths:
      - 'tools/oc_clean_run.txt'
permissions:
  contents: write
jobs:
  apply:
    if: github.ref_name != 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Apply cleanup
        run: python3 tools/oc_clean.py
      - name: Commit
        run: |
          git config user.name telesia-agent
          git config user.email agent@telesia.site
          git add -A
          git commit -m "Cleanup: silence remaining analyzer warnings" || true
          git push || true